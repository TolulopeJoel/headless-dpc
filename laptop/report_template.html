<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rye&family=Bebas+Neue&family=Special+Elite&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Karla:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* SceneRec · Ransom Collage (ui-vibes): newsprint, cut-out letters, tape. Light only. */
:root {
  color-scheme: light;
  --page: #ECE8DF; --card: #F8F6F0; --ink: #151515; --ink-2: #4A463F; --muted: #7A746A;
  --line: #D5CFC2; --grid: #DDD7CA; --base: #B9B2A4; --tape: #F3E6BF;
  --red: #C8352A; --teal: #1C6E70; --mustard: #D79A1E;
  --work: #151515; --study: #C8352A; --field: #1C6E70; --bank: #D79A1E;
  --tip: #151515;
}
* { box-sizing: border-box; }
body { margin: 0; background-color: var(--page); background-image: repeating-linear-gradient(0deg, rgba(21,21,21,.03) 0 1px, rgba(21,21,21,0) 1px 4px);
  color: var(--ink); font: 15px/1.45 Karla, system-ui, -apple-system, sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 30px 16px 64px; }

/* cut-outs */
.cut { display: inline-block; filter: drop-shadow(2px 2px 0 rgba(21,21,21,.3)); }
.cut > span { display: block; line-height: 1.05; clip-path: polygon(0 4%, 22% 0, 48% 5%, 74% 0, 100% 3%, 98% 52%, 100% 97%, 70% 100%, 44% 95%, 18% 100%, 0 96%, 2% 48%); }
.f-anton { font-family: Anton, sans-serif; } .f-rye { font-family: Rye, serif; } .f-bebas { font-family: "Bebas Neue", sans-serif; }
.f-play { font-family: "Playfair Display", serif; font-style: italic; font-weight: 900; } .f-elite { font-family: "Special Elite", monospace; }
.tape { display: inline-block; background: var(--tape); color: var(--ink); font: 12px/1.3 "Special Elite", monospace; padding: 4px 14px;
  clip-path: polygon(0 0, 100% 0, 97% 25%, 100% 50%, 97% 75%, 100% 100%, 0 100%, 3% 75%, 0 50%, 3% 25%); }

.top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.week { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.mock { transform: rotate(-3deg); border: 2px solid var(--teal); border-radius: 3px; padding: 3px 10px; color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.lab { position: absolute; top: -13px; left: 14px; margin: 0; transform: rotate(-2deg); }
.lab .tape { font-size: 12px; }
.card { position: relative; background: var(--card); border: 2px solid var(--ink); border-radius: 3px; box-shadow: 4px 4px 0 var(--ink); padding: 24px 20px 18px; min-width: 0; }
.grid { display: grid; gap: 22px; margin-bottom: 22px; }
.g-hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
@media (max-width: 720px) { .g-hero { grid-template-columns: minmax(0, 1fr); } }

.agency { display: flex; align-items: flex-end; gap: 4px; margin-top: 4px; }
.agency .cut > span { font-size: 86px; padding: 8px 12px 6px; }
.agency .pct > span { font-size: 44px; }
.delta { margin-top: 12px; display: inline-block; transform: rotate(-2deg); border: 2px solid var(--teal); color: var(--teal); border-radius: 3px; padding: 2px 9px; font-size: 13px; font-weight: 800; letter-spacing: .06em; }
.delta.down { border-color: var(--red); color: var(--red); }

.cat-h { margin: 40px 0 18px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; font-weight: 400; }
.cat-h .cut > span { font-size: 30px; padding: 4px 8px 3px; }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); gap: 22px; margin-bottom: 14px; align-items: start; }
@media (max-width: 720px) { .cat { grid-template-columns: minmax(0, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 16px; }
.tile { padding: 22px 16px 14px; }
.tile:nth-child(4n+1) { transform: rotate(-1deg); } .tile:nth-child(4n+2) { transform: rotate(1.2deg); }
.tile:nth-child(4n+3) { transform: rotate(.6deg); } .tile:nth-child(4n) { transform: rotate(-1.4deg); }
.tile .v { font: 46px/1 Anton, sans-serif; letter-spacing: .01em; }
.tile .v small { font: 700 15px Karla, sans-serif; color: var(--ink-2); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 0 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 1px; display: inline-block; }
.sw.out { background: transparent !important; border: 1.5px dashed var(--ink); }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: Karla, system-ui, sans-serif; }
.scroll { overflow-x: auto; } .scroll svg { min-width: 700px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; color: var(--ink); }
td { text-align: left; padding: 7px 8px; border-bottom: 1px dashed var(--base); }
.honest td:first-child { white-space: nowrap; color: var(--ink-2); font-family: "Special Elite", monospace; width: 1%; }
.zero { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 14px; }
.zero b { font: 26px Anton, sans-serif; color: var(--ink); margin-right: 6px; }
button { height: 46px; padding: 0 20px; background: var(--red); color: #fff; border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font: 800 15px Karla, sans-serif; cursor: pointer; }
button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.empty { margin: 6px 0 2px; font: 14px "Special Elite", monospace; color: var(--muted); }
#tip { position: fixed; pointer-events: none; background: var(--tape); color: var(--ink); font: 13px "Special Elite", monospace; padding: 6px 10px; border: 1.5px solid var(--ink); opacity: 0; z-index: 9; max-width: 260px; }
</style>
</head>
<body>
<main>
  <div class="top"><span class="week" id="week"></span><span class="mock" id="made"></span></div>

  <section class="grid g-hero">
    <div class="card">
      <p class="lab"><span class="tape">Agency</span></p>
      <div class="agency" id="agency"></div>
      <div class="delta" id="delta"></div>
      <div id="trend" style="margin-top:14px"></div>
    </div>
    <div class="card">
      <p class="lab"><span class="tape">What made it</span></p>
      <div id="parts"></div>
    </div>
  </section>

  <section class="card" style="margin-bottom:14px">
    <p class="lab"><span class="tape">Planned vs happened</span></p>
    <div class="legend" id="legend"></div>
    <div class="scroll" id="timeline"></div>
  </section>

  <h2 class="cat-h" data-cut>Spiritual</h2>
  <section class="cat">
    <div class="tiles" id="t-spiritual"></div>
    <div class="card"><p class="lab"><span class="tape">Field, hours a day</span></p><div id="field"></div></div>
  </section>

  <h2 class="cat-h" data-cut>Work</h2>
  <section class="cat">
    <div class="tiles" id="t-work"></div>
    <div class="card"><p class="lab"><span class="tape">Laptop, sites in front (h)</span></p><div id="sites"></div></div>
  </section>

  <h2 class="cat-h" data-cut>Kowane</h2>
  <section class="cat">
    <div class="tiles" id="t-kowane"></div>
    <div class="card"><p class="lab"><span class="tape">Kowane, hours a day</span></p><div class="legend" id="kow-legend"></div><div id="kowane"></div></div>
  </section>

  <h2 class="cat-h" data-cut>Rest</h2>
  <section class="cat">
    <div class="tiles" id="t-rest"></div>
    <div class="card"><p class="lab"><span class="tape">Phone dark, each night</span></p><div id="sleep"></div></div>
  </section>

  <h2 class="cat-h" data-cut>Screens</h2>
  <section class="cat">
    <div class="tiles" id="t-screens"></div>
    <div class="card"><p class="lab"><span class="tape">Phone, fun apps (min a day)</span></p><div id="drift"></div></div>
  </section>

  <h2 class="cat-h" data-cut>Integrity</h2>
  <section class="card honest">
    <p class="lab"><span class="tape">Honest list</span></p>
    <table><tbody id="honest"></tbody></table>
    <div class="zero" id="zeros"></div>
    <div style="margin-top:14px"><button id="copy">Copy for your witness</button></div>
  </section>
</main>
<div id="tip"></div>
<script>
const R = /*DATA*/null;
const $ = id => document.getElementById(id);
const m = s => { const [h, mm] = s.split(":").map(Number); return h * 60 + mm; };
const D = R.days;
const num = (v, d = 1) => v === null || v === undefined ? "—" : (typeof v === "number" && d >= 0 && !Number.isInteger(v) ? v.toFixed(d) : v);
const tile = (lab, v, unit = "") => `<div class="card tile"><p class="lab"><span class="tape">${lab}</span></p><div class="v">${v}${unit && v !== "—" ? `<small> ${unit}</small>` : ""}</div></div>`;
// Cut-outs: each piece in its own paper, type and tilt, chosen by position so the page is the same every time.
const PAPERS = [["#151515","#ECE8DF","f-anton"],["#D79A1E","#151515","f-play"],["#C8352A","#FFFFFF","f-rye"],["#1C6E70","#FFFFFF","f-bebas"],
                ["#F3E6BF","#151515","f-elite"],["#F8F6F0","#C8352A","f-bebas"],["#151515","#D79A1E","f-play"]];
const TILT = [-4, 3, -2, 5, -3, 2, -1.5, 4];
const cut = (text, i, cls = "") => { const [bg, fg, f] = PAPERS[i % PAPERS.length];
  return `<span class="cut ${cls}" style="transform:rotate(${TILT[i % TILT.length]}deg)"><span class="${f}" style="background:${bg};color:${fg}">${text}</span></span>`; };
const ransom = (text, start = 0, per = "letter") => (per === "word" ? text.split(" ") : [...text]).map((t, i) => t === " " ? '<span style="width:10px"></span>' : cut(t, start + i)).join("");
$("week").innerHTML = ransom(R.week, 2, "word").replace(/class="cut "/g, 'class="cut" ').replace(/<span class="(f-[a-z]+)" style="/g, '<span class="$1" style="font-size:26px;padding:4px 9px 3px;');
$("made").textContent = "Made " + R.made;
$("agency").innerHTML = [...String(R.agency)].map((d, i) => cut(d, [0, 2, 3][i % 3])).join("") + cut("%", 4, "pct");
const delta = $("delta");
delta.textContent = R.delta === null ? "First week" : (R.delta >= 0 ? `▲ ${R.delta} on last week` : `▼ ${-R.delta} on last week`);
if (R.delta !== null && R.delta < 0) delta.classList.add("down");
document.querySelectorAll("[data-cut]").forEach((h, k) => { h.innerHTML = ransom(h.textContent.trim(), k * 3); });
const T = R.tiles;
$("t-spiritual").innerHTML = tile("Bible", num(T.bible)) + tile("Study", num(T.study_h), "h") + tile("Meeting prep", T.prep) + tile("Meetings", T.meetings) + tile("Field", num(T.field_h), "h");
$("t-work").innerHTML = tile("Work", num(T.work_h), "h");
$("t-kowane").innerHTML = tile("Banks", num(T.banks)) + tile("At banks", num(T.bank_h), "h") + tile("Building", num(T.build_h), "h");
$("t-rest").innerHTML = tile("Sleep", num(T.sleep_h), "h") + tile("Dark by 21:30", T.nights ? `${T.dark_ok}<small> / ${T.nights}</small>` : "—");
$("t-screens").innerHTML = tile("Fun apps", num(T.fun_h), "h") + tile("Daily", num(T.fun_daily, 0), "min");
$("honest").innerHTML = R.honest.length ? R.honest.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("") : `<tr><td>—</td><td>Nothing to own up to.</td></tr>`;
$("zeros").innerHTML = R.zeros.map(([n, l]) => `<span><b>${n}</b>${l}</span>`).join("");

// Agency: last four weeks
(function () {
  const W = R.trend, w = 300, h = 74, L = 18, R2 = 30, T = 14, B = 18;
  const x = i => W.length > 1 ? L + i * (w - L - R2) / (W.length - 1) : w / 2, lo = Math.min(50, ...W.map(d => d[1])), y = v => T + (h - T - B) * (1 - (v - lo) / (100 - lo));
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Agency, last four weeks">`;
  s += `<path d="${W.map((d, i) => (i ? "L" : "M") + x(i) + "," + y(d[1])).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  W.forEach((d, i) => {
    s += `<circle cx="${x(i)}" cy="${y(d[1])}" r="5" fill="${i === W.length - 1 ? "var(--ink)" : "var(--card)"}" stroke="var(--ink)" stroke-width="2" data-tip="Week of ${d[0]}: ${d[1]}%"/>`;
    s += `<text x="${x(i)}" y="${h - 3}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${d[0]}</text>`;
  });
  s += `<text x="${x(W.length - 1) + 9}" y="${y(W[W.length - 1][1]) + 4}" font-size="12" font-weight="600" fill="var(--ink)">${W[W.length - 1][1]}</text>`;
  $("trend").innerHTML = s + "</svg>";
})();

// Agency: the five parts, each 0–100, with its weight
(function () {
  const P = R.parts;
  const w = 460, row = 34, L = 122, h = P.length * row;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="The parts of agency">`;
  P.forEach(([n, v, wt], i) => {
    const y = i * row, bw = (w - L - 64) * v / 100;
    s += `<text x="${L - 10}" y="${y + 19}" font-size="13" fill="var(--ink-2)" text-anchor="end">${n.length > 17 ? "…" + n.slice(-16) : n}</text>`;
    s += `<rect x="${L}" y="${y + 7}" width="${w - L - 64}" height="16" rx="1.5" fill="var(--grid)"/>`;
    s += `<rect x="${L}" y="${y + 7}" width="${bw}" height="16" rx="1.5" fill="${v < 60 ? "var(--study)" : "var(--ink)"}" data-tip="${n}: ${v}% · weight ${wt}% · adds ${(v * wt / 100).toFixed(1)}"/>`;
    s += `<text x="${w - 56}" y="${y + 20}" font-size="13" font-weight="600" fill="var(--ink)">${v}%</text>`;
    s += `<text x="${w - 2}" y="${y + 20}" font-size="11" fill="var(--muted)" text-anchor="end">×${wt}</text>`;
  });
  $("parts").innerHTML = s + "</svg>";
})();

// The week planned (outlines) against the week that happened (solid bars), on one time line.
const K = { Study: "var(--study)", Field: "var(--field)", Work: "var(--work)", Kowane: "var(--bank)" };
$("legend").innerHTML = Object.entries(K).map(([k, c]) => `<span><i class="sw" style="background:${c}"></i>${k}</span>`).join("") +
  `<span><i class="sw out"></i>Planned</span><span><i class="sw" style="background:var(--ink);height:5px"></i>Happened</span>`;
const PLAN = R.plan, DID = R.did;
(function () {
  const w = 960, L = 42, RR = 22, T = 20, row = 42, h = T + row * 7;
  const x = t => L + (m(t) - 300) / (1320 - 300) * (w - L - RR);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="The week planned against the week that happened">`;
  for (let hr = 5; hr <= 22; hr++) {
    const X = x(String(hr).padStart(2, "0") + ":00");
    s += `<line x1="${X}" x2="${X}" y1="${T - 4}" y2="${h}" stroke="var(--grid)"/>`;
    if (hr % 3 === 2 || hr === 22) s += `<text x="${X}" y="11" font-size="11" fill="var(--muted)" text-anchor="middle">${String(hr).padStart(2, "0")}:00</text>`;
  }
  D.forEach((d, i) => {
    const y = T + i * row, n0 = x(d === "Sat" ? "20:00" : "21:00");
    s += `<text x="0" y="${y + row / 2 + 4}" font-size="12.5" font-weight="600" fill="var(--ink-2)">${d}</text>`;
    s += `<rect x="${n0}" y="${y + 5}" width="${x("22:00") - n0}" height="${row - 10}" rx="1.5" fill="var(--grid)" data-tip="${d}: laptop offline"/>`;
  });
  PLAN.forEach(([d, k, a, b]) => {
    const y = T + D.indexOf(d) * row + 5;
    s += `<rect x="${x(a) + 1}" y="${y}" width="${x(b) - x(a) - 2}" height="${row - 10}" rx="2" fill="${K[k]}" fill-opacity=".1" stroke="${K[k]}" stroke-width="1.3" stroke-dasharray="4 3" data-tip="${d} ${k} planned ${a}–${b}"/>`;
  });
  DID.forEach(([d, k, a, b, note]) => {
    const y = T + D.indexOf(d) * row + row / 2 - 7;
    const plan = PLAN.some(([pd, pk, pa, pb]) => pd === d && pk === k && m(pa) < m(b) && m(pb) > m(a));
    s += `<rect x="${x(a) + 1}" y="${y}" width="${Math.max(3, x(b) - x(a) - 2)}" height="14" rx="1.5" fill="${K[k] || "var(--muted)"}" ${note === "unsure" ? 'fill-opacity=".45"' : ""} data-tip="${d} ${k} ${a}–${b}${plan ? "" : " · not planned"}${note ? " · " + note : ""}"/>`;
  });
  $("timeline").innerHTML = s + "</svg>";
})();

function bars(el, data, o) {
  const w = 440, h = 170, L = 28, B = 22, T = 18, bw = (w - L) / data.length, y = v => T + (h - T - B) * (1 - v / o.max);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.label}">`;
  o.ticks.forEach(t => s += `<line x1="${L}" x2="${w}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" font-size="10.5" fill="var(--muted)" text-anchor="end">${t}</text>`);
  data.forEach(([lab, v, plan], i) => {
    const x = L + i * bw + bw * .2, bw2 = bw * .6;
    if (plan > v) s += `<rect x="${x}" y="${y(plan)}" width="${bw2}" height="${y(v) - y(plan) + (v > 0 ? 4 : 0)}" rx="1.5" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3"/>`;
    if (v > 0) s += `<path d="M${x},${y(0)} V${y(v) + 1.5} q0,-1.5 1.5,-1.5 H${x + bw2 - 1.5} q1.5,0 1.5,1.5 V${y(0)} Z" fill="${o.colour}" data-tip="${lab}: ${o.fmt(v)}${plan ? " of " + o.fmt(plan) : ""}"/>`;
    if (v > 0) s += `<text x="${x + bw2 / 2}" y="${Math.min(y(v), plan ? y(plan) : y(v)) - 5}" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle">${o.short(v)}</text>`;
    s += `<text x="${x + bw2 / 2}" y="${h - 5}" font-size="11.5" fill="var(--ink-2)" text-anchor="middle">${lab}</text>`;
  });
  $(el).innerHTML = s + `<line x1="${L}" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--base)"/></svg>`;
}
const FIELD = R.field;
bars("field", FIELD, { max: Math.max(6, ...FIELD.map(f => Math.max(f[1], f[2]))), ticks: [0, 2, 4, 6], colour: "var(--field)", label: "Field hours by day", fmt: v => v.toFixed(1) + " h", short: v => v.toFixed(1) });
(function () {
  // Fun apps (the phone's drift apps): one row per app, minutes each day, biggest first.
  const APPS = R.apps;
  if (!APPS.length) { $("drift").innerHTML = `<p class="empty">No phone data this week</p>`; return; }
  const w = 440, L = 112, row = 50, B = 20, h = APPS.length * row + B, max = Math.max(10, ...APPS.flatMap(a => a[1])), cw = (w - L) / 7;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Minutes in each fun app by day">`;
  APPS.forEach(([app, days], i) => {
    const base = i * row + row - 8, tot = days.reduce((a, b) => a + b, 0);
    s += `<text x="0" y="${base - 18}" font-size="13" font-weight="600" fill="var(--ink)">${app}</text>`;
    s += `<text x="0" y="${base - 2}" font-size="11.5" fill="var(--muted)">${tot} min</text>`;
    s += `<line x1="${L}" x2="${w}" y1="${base}" y2="${base}" stroke="var(--base)"/>`;
    days.forEach((v, j) => {
      const bh = (row - 22) * v / max, x = L + j * cw + cw * .22;
      s += `<path d="M${x},${base} V${base - bh + 1} q0,-1 1,-1 H${x + cw * .56 - 1} q1,0 1,1 V${base} Z" fill="var(--study)" data-tip="${app} · ${D[j]}: ${v} min"/>`;
    });
    const top = days.indexOf(Math.max(...days));
    s += `<text x="${L + top * cw + cw / 2}" y="${base - (row - 22) * days[top] / max - 4}" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="middle">${days[top]}</text>`;
  });
  D.forEach((d, j) => s += `<text x="${L + j * cw + cw / 2}" y="${h - 4}" font-size="11" fill="var(--ink-2)" text-anchor="middle">${d}</text>`);
  $("drift").innerHTML = s + "</svg>";
})();

(function () {
  // When the phone went dark each night: one dot per night against the 21:30 line, sleep hours under the day.
  const NIGHTS = R.nights;
  if (!NIGHTS.length) { $("sleep").innerHTML = `<p class="empty">No phone data this week</p>`; return; }
  const w = 440, h = 190, L = 44, RR = 8, T = 14, B = 38, lo = Math.min(m("20:30"), ...NIGHTS.map(n => m(n[1]) - 15)), hi = Math.max(m("23:00"), ...NIGHTS.map(n => m(n[1]) + 15));
  const mm = t => { let v = m(t); if (v < 720) v += 1440; return v; };
  const y = t => T + (h - T - B) * (1 - (m(t) - lo) / (hi - lo)), cw = (w - L - RR) / NIGHTS.length, cx = i => L + cw * (i + .5);
  const lowY = T + (h - T - B);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Time the phone went dark each night">`;
  ["21:00","22:00","23:00"].forEach(t => s += `<line x1="${L}" x2="${w - RR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" font-size="10.5" fill="var(--muted)" text-anchor="end">${t}</text>`);
  s += `<rect x="${L}" y="${y("21:30")}" width="${w - L - RR}" height="${lowY - y("21:30")}" fill="var(--field)" opacity=".09"/>`;
  s += `<line x1="${L}" x2="${w - RR}" y1="${y("21:30")}" y2="${y("21:30")}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s += `<text x="${L - 6}" y="${y("21:30") + 4}" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="end">21:30</text>`;
  NIGHTS.forEach(([d, a, b], i) => {
    const hrs = (mm(b) - mm(a)) / 60, ok = m(a) <= m("21:30"), X = cx(i), Y = y(a);
    s += `<line x1="${X}" x2="${X}" y1="${y("21:30")}" y2="${Y}" stroke="${ok ? "var(--field)" : "var(--study)"}" stroke-width="2"/>`;
    s += `<circle cx="${X}" cy="${Y}" r="6" fill="${ok ? "var(--field)" : "var(--study)"}" stroke="var(--card)" stroke-width="2"/>`;
    s += `<text x="${X}" y="${ok ? Y + 18 : Y - 10}" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="middle">${a}</text>`;
    s += `<text x="${X}" y="${h - 20}" font-size="11.5" fill="var(--ink-2)" text-anchor="middle">${d}</text>`;
    s += `<text x="${X}" y="${h - 5}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${hrs.toFixed(1)}h</text>`;
    s += `<rect x="${X - cw / 2}" y="${T}" width="${cw}" height="${h - T - B}" fill="transparent" data-tip="${d}: dark ${a}, light ${b} · ${hrs.toFixed(1)} h"/>`;
  });
  $("sleep").innerHTML = s + "</svg>";
})();

(function () {
  const SITES = R.sites;
  if (!SITES.length) { $("sites").innerHTML = `<p class="empty">Nothing recorded yet</p>`; return; }
  const w = 440, row = 22, L = 104, h = SITES.length * row, max = SITES[0][1];
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Websites in front on the laptop">`;
  SITES.forEach(([n, v], i) => {
    const y = i * row, bw = (w - L - 36) * v / max;
    s += `<text x="${L - 8}" y="${y + 14}" font-size="11.5" fill="var(--ink-2)" text-anchor="end">${n.length > 17 ? "…" + n.slice(-16) : n}</text>`;
    s += `<rect x="${L}" y="${y + 4}" width="${bw}" height="13" rx="1.5" fill="var(--work)" data-tip="${n}: ${v} h"/>`;
    s += `<text x="${L + bw + 5}" y="${y + 14}" font-size="11.5" font-weight="600" fill="var(--ink)">${v}</text>`;
  });
  $("sites").innerHTML = s + "</svg>";
})();

(function () {
  // Kowane: time at banks (Business calendar) and building time (WakaTime, kowane project), stacked by day.
  const KOW = R.kowane;
  const w = 440, h = 170, L = 28, B = 22, T = 18, bw = (w - L) / KOW.length, max = Math.max(4, Math.ceil(Math.max(...KOW.map(k => k[1] + k[2])))), y = v => T + (h - T - B) * (1 - v / max);
  $("kow-legend").innerHTML = `<span><i class="sw" style="background:var(--bank)"></i>At banks</span><span><i class="sw" style="background:var(--ink)"></i>Building</span>`;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Kowane hours by day">`;
  [...Array(max + 1).keys()].filter(t => max <= 6 || t % 2 === 0).forEach(t => s += `<line x1="${L}" x2="${w}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" font-size="10.5" fill="var(--muted)" text-anchor="end">${t}</text>`);
  KOW.forEach(([d, bank, build], i) => {
    const x = L + i * bw + bw * .2, b2 = bw * .6, tot = bank + build, tip = `${d}: banks ${bank.toFixed(1)} h · building ${build.toFixed(1)} h`;
    if (bank) s += `<rect x="${x}" y="${y(bank)}" width="${b2}" height="${y(0) - y(bank)}" rx="${build ? 0 : 4}" fill="var(--bank)" data-tip="${tip}"/>`;
    if (build) s += `<rect x="${x}" y="${y(tot)}" width="${b2}" height="${y(bank) - y(tot) - (bank ? 2 : 0)}" rx="1.5" fill="var(--ink)" data-tip="${tip}"/>`;
    if (tot) s += `<text x="${x + b2 / 2}" y="${y(tot) - 5}" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle">${tot.toFixed(1)}</text>`;
    s += `<text x="${x + b2 / 2}" y="${h - 5}" font-size="11.5" fill="var(--ink-2)" text-anchor="middle">${d}</text>`;
  });
  $("kowane").innerHTML = s + `<line x1="${L}" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--base)"/></svg>`;
})();

const tip = $("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.getAttribute("data-tip");
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = e.clientY + 16 + "px"; tip.style.opacity = 1;
});
$("copy").addEventListener("click", () => navigator.clipboard.writeText(R.copy).then(() => $("copy").textContent = "Copied"));
</script>
</body>
