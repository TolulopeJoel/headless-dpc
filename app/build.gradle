plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tolu.dpc'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.tolu.dpc"
        minSdk 26
        targetSdk 35
        versionCode 74
        versionName "8.3"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Geofencing for the field pass: Google's location service records when the phone left home and came back,
    // with the time of each, even while HiOS has the DPC frozen.
    implementation('com.google.android.gms:play-services-location:21.3.0') {
        exclude group: 'org.jetbrains.kotlin'   // the app's own Kotlin standard library covers it
    }
}
